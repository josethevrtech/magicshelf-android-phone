name: Creation build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Creation version to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  frame:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libegl1-mesa-dev libgles2-mesa-dev libcairo2-dev libjson-c-dev libpipewire-0.3-dev libx11-dev libxtst-dev python3-cairo
      - uses: actions/checkout@v4
        with:
          repository: ValveSoftware/openvr
          ref: 0924064316de3effbcd1acf1e309182a2deb1c05
          path: vendor/openvr
      - run: ./build.sh
        env:
          OPENVR_LIB_DIR: ${{ github.workspace }}/vendor/openvr/bin/linuxarm64
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 -c 'import json,os; v=json.load(open("module.json"))["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v, "Tag must match creation version"'
      - run: python3 tests/test_runtime_preparation.py
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: frame-package
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: frame
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frame-package
          path: dist
      - name: Publish Android Phone (Virtual) release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="v$REQUESTED_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          python3 - "$TAG" <<'CHECK'
          import json,re,sys,pathlib
          tag=sys.argv[1]
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag), 'Use a release version such as 0.2.6'
          meta=json.loads(pathlib.Path('dist/catalog.json').read_text())['modules'][0]
          assert tag == 'v'+meta['version'], 'Requested version must match the built creation'
          CHECK
          # A tested on-device package may already have been published manually.
          # Repeated tag/dispatch jobs must validate it without replacing its bytes.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)" = false ]; then
            mkdir published
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published --pattern catalog.json --pattern SHA256SUMS --pattern '*.magicshelf'
            python3 - "$TAG" <<'VERIFY'
          import hashlib,json,pathlib,sys
          expected=json.loads(pathlib.Path('dist/catalog.json').read_text())['modules'][0]
          root=pathlib.Path('published')
          item=json.loads((root/'catalog.json').read_text())['modules'][0]
          assert sys.argv[1]=='v'+item['version'], 'Published version does not match tag'
          for field in ('id','architecture','api_version','permissions'):
              assert item[field]==expected[field], 'Published metadata differs: '+field
          name=item['url'].rsplit('/',1)[-1]
          archive=root/name
          assert archive.stat().st_size==item['size_bytes'], 'Published size mismatch'
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest==item['sha256'], 'Published checksum mismatch'
          assert (digest+'  '+name) in (root/'SHA256SUMS').read_text().splitlines(), 'Checksum list mismatch'
          print('Published release is complete; preserving its verified immutable assets.')
          VERIFY
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Android Phone (Virtual) $TAG" --notes "Guided setup for MagicShelf on Steam Frame. Requires MagicShelf 0.3.8 or newer. Existing subscriptions and saved data are preserved."
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
